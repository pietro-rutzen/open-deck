[package]
name = "compas-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Audio source abstraction for compas: local-file PCM decode (symphonia) and streaming control-only handles."

[dependencies]
compas-core = { workspace = true }
tracing = { workspace = true }

[dependencies.symphonia]
workspace = true
# Permissive (MPL-2.0). AIFF here is uncompressed PCM. AAC-LC in MPEG-4 ADTS
# and in MPEG-4 (.m4a) is checked with generated fixtures. MPEG-2 ADTS, ALAC,
# HE-AAC, and compressed AIFC stay unsupported. Patent note:
# MP3 patents have expired; AAC patents have not.
features = ["mp3", "flac", "wav", "pcm", "ogg", "vorbis", "isomp4", "aac", "aiff"]

[lints]
workspace = true
